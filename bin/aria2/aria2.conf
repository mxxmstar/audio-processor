# aria2 配置文件

# RPC 配置
enable-rpc=true
rpc-listen-port=6800
rpc-secret=aria2_secret_token_2026
rpc-allow-origin-all=true

# 下载配置
dir=./downloads
max-concurrent-downloads=5
max-connection-per-server=16
min-split-size=1M
split=16

# 断点续传
continue=true

# BT 配置
enable-dht=true
enable-peer-exchange=true
bt-enable-lpd=true
follow-torrent=mem

# 日志
log=aria2.log
log-level=info

# 会话保存
save-session=aria2.session
input-file=aria2.session

# 自动保存会话间隔（秒）
save-session-interval=60

# 磁盘缓存
disk-cache=32M

# 文件分配
file-allocation=prealloc
